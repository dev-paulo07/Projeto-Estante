<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Leitura</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="cabecalho">
        <div class="banner-container">
            <img src="https://picsum.photos/id/24/1920/400?blur=1" alt="Banner de Livro" class="banner-img">
        </div>

        <div class="container mt-4">
            <h1 class="titulo-principal"><i class="fa-solid fa-book-open me-2"></i>Gerenciador de Leitura</h1>
            <hr class="text-muted">
        </div>
    </header>

    <main class="container my-4">
        <div class="row g-4">

            <aside class="col-lg-3">
                
                <div class="card-lateral p-3 mb-3">
                    <h5 class="titulo-card"><i class="fa-solid fa-bolt me-2 text-warning"></i>Ações Rápidas</h5>
                    <form id="form-livro" class="mt-3">
                        <div class="mb-3">
                            <label for="titulo-livro" class="form-label text-muted small">Nome do Livro</label>
                            <input type="text" id="titulo-livro" class="form-control estilo-input"
                                placeholder="Ex: Percy Jackson">
                        </div>

                        <div class="mb-3">
                            <label for="status-livro" class="form-label text-muted small">Status</label>
                            <select id="status-livro" class="form-select estilo-input">
                                <option value="Quero ler">Quero ler</option>
                                <option value="Em andamento">Em andamento</option>
                                <option value="Lido">Lido</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="genero-livro" class="form-label text-muted small">Gênero</label>
                            <input type="text" id="genero-livro" class="form-control estilo-input"
                                placeholder="Ex: Fantasia">
                        </div>

                        <div class="mt-2">
                            <button type="submit" class="btn btn-outline-dark w-100"><i
                                    class="fa-solid fa-plus me-2"></i>Adicionar</button>
                        </div>
                    </form>
                </div>

                <div class="card-informativo p-3 text-muted small border-start border-warning border-3 d-flex gap-2">
                    <i class="fa-solid fa-info-circle me-1 text-warning mt-1"></i>
                    <p class="mb-0">Utilize esta página para organizar suas leituras de uma forma prática e planejada.
                    </p>
                </div>
            </aside>

            <section class="col-lg-9">

                <div class="tabela-container p-4">

                    <div class="abas-estante mb-3">
                        <span class="aba-ativa"><i class="fa-solid fa-table-list me-1"></i> Tabela de Leitura</span>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tabela-livros">
                            <thead>
                                <tr>
                                    <th scope="col" class="text-muted fw-normal"><i class="fa-solid fa-book me-1"></i>
                                        Livro</th>
                                    <th scope="col" class="text-muted fw-normal"><i
                                            class="fa-solid fa-circle-dot me-1"></i> Status</th>
                                    <th scope="col" class="text-muted fw-normal"><i class="fa-solid fa-tags me-1"></i>
                                        Gênero</th>
                                    <th scope="col" class="text-muted fw-normal text-end"><i
                                            class="fa-solid fa-gear me-1"></i> Ações</th>
                                </tr>
                            </thead>
                            
                            <tbody id="lista-livros">
                            </tbody>
                        </table>
                    </div>

                </div>

            </section>

        </div>
    </main>

    <footer class="text-center py-4 text-muted small">
        <p class="mb-0">Gerenciador de Leitura © 2026 | Desenvolvido por Paulo Castro</p>
    </footer>
     <div id="container-login" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-flex align-items-center justify-content-center d-none" style="z-index: 9999;">
        <div class="card p-4 bg-dark text-white border border-secondary shadow-lg" style="max-width: 380px; width: 90%;">
            <h4 class="text-center mb-3">🔑 Autenticação</h4>
            <p class="text-white-50 text-center small mb-3">Faça login para gerenciar sua estante de livros.</p>
            
            <form id="form-login-box">
                <div class="mb-3">
                    <label class="form-label small">E-mail</label>
                    <input type="email" id="login-email" class="form-control text-white bg-secondary border-0" required placeholder="seu@email.com">
                </div>
                <div class="mb-3">
                    <label class="form-label small">Senha</label>
                    <input type="password" id="login-senha" class="form-control text-white bg-secondary border-0" required placeholder="******">
                </div>
                
                <div id="login-erro" class="alert alert-danger py-2 small d-none"></div>
                
                <button type="submit" class="btn btn-primary w-100 fw-semibold mt-2">Entrar na Estante</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
